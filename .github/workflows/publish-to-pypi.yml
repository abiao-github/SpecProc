name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    environment: pypi            # 与 PyPI 上填写的 Environment name 保持一致
    permissions:
      contents: read             # checkout 代码所需
      id-token: write            # 关键：Trusted Publishing (OIDC) 必需
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # 让重跑变成“幂等”操作，已存在的文件自动跳过