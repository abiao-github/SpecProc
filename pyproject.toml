[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SpecProc"
# 版本号唯一来源：src/specproc/__init__.py 里的 __version__
# 发版时只改那一处，打包/CLI --version/PyPI 三处自动一致。
dynamic = ["version"]
description = "A spectral processing tool"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    {name = "Niu, Hubiao", email = "niuhubiao@xao.ac.cn"}
]
keywords = ["spectroscopy", "FITS", "data-reduction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "PyQt5",
]

[project.urls]
Homepage = "https://github.com/abiao-github/SpecProc"
Repository = "https://github.com/abiao-github/SpecProc"
Releases = "https://github.com/abiao-github/SpecProc/releases"

[project.scripts]
specproc = "specproc.main:main"
"specproc.air2vac" = "specproc.utils.airvac:air2vac_main"
"specproc.vac2air" = "specproc.utils.airvac:vac2air_main"
"specproc.identify" = "specproc.utils.identify:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["specproc*"]

[tool.setuptools.dynamic]
version = {attr = "specproc.__version__"}

[tool.setuptools.package-data]
# 只把运行时会用到的校准数据打进安装包：
#   - 配置文件与样例（*.cfg / *.sample）
#   - 灯谱线表与图集（calib_data/linelists/*）
#   - 各望远镜的锚线表与参考灯谱（*.csv / *.txt / *.fits / *.dat）
# 校准目录里的 PDF 与 .DS_Store 只是文档/系统垃圾，不进安装包
# （曾因 calib_data/telescopes/*/* 把两个 44MB/26MB 的南山 PDF 打进去，
#   让 sdist 涨到 73.6MB；白名单方式后约 1.3MB）
specproc = [
    "*.cfg",
    "*.sample",
    "calib_data/linelists/*",
    "calib_data/telescopes/*/*.csv",
    "calib_data/telescopes/*/*.txt",
    "calib_data/telescopes/*/*.fits",
    "calib_data/telescopes/*/*.dat",
]

[tool.setuptools.exclude-package-data]
# 双保险：任何层级的 PDF 与 .DS_Store 都不要
specproc = [
    "*.pdf",
    "**/*.pdf",
    "**/.DS_Store",
]
