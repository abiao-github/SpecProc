# SpecProc Default Configuration
# This file contains default parameters for echelle spectrograph data reduction
#
# To customize, create a specproc.cfg file in the working directory
# Values in specproc.cfg will override these defaults

# ============================================================================
# DATA & INSTRUMENTS CONFIGURATION
# ============================================================================
[data]
# Raw FITS data directory path
# Note: These are default values. Users should create specproc.cfg in their working directory
# to override these paths for their specific projects.
#
# Path behavior:
# - rawdata_path = /data/20241102_hrs       → Absolute path, loads from /data/20241102_hrs/
# - rawdata_path = ./20241102_hrs           → Relative path, loads from working_directory/20241102_hrs/
# - rawdata_path = 20241102_hrs             → Same as above, also relative to working directory
#   (e.g., if working in /myworkspace/, loads from /myworkspace/20241102_hrs/)
#
# Examples (assuming working directory is /myworkspace/):
#   rawdata_path = ./20241102_hrs      → Data from /myworkspace/20241102_hrs/
#   rawdata_path = 20241102_hrs        → Same as above, data from /myworkspace/20241102_hrs/
#   rawdata_path = /data/20241102_hrs  → Data from /data/20241102_hrs/
rawdata_path = ./rawdata

# FITS header keywords
statime_key = DATE-OBS
exptime_key = EXPTIME

# Image dispersion direction
# Options: xrb (X-axis Right, Y-axis Bottom), xlb (X-axis Left, Y-axis Bottom)
#          yrb (Y-axis Right, X-axis Bottom), ylb (Y-axis Left, X-axis Bottom)
direction = yrb

# Overscan correction
# Overscan region configuration. MSTG193 slit frames contain two amplifier
# overscan sections; BIASSEC1/BIASSEC2 in the FITS header are applied to the
# left/right halves of the science area independently.
# overscan_start_column remains the fallback when these keywords are absent.
# For 4160x4136 images: data columns 1-4096, overscan columns 4097-4160
# Set to -1 to disable overscan correction
overscan_start_column = 4097

# Overscan correction method: mean_only, mean_savgol, or mean_polynomial
# - mean_only: Sigma-clipped mean only, no smoothing
# - mean_savgol: Sigma-clipped mean with Savitzky-Golay smoothing
# - mean_polynomial: Sigma-clipped mean with polynomial fitting (IRAF style)
overscan_method = mean_savgol

# Overscan Savitzky-Golay smoothing window (in pixels, default is 1/5 of image height)
# Set to -1 for automatic (1/5 of image height)
overscan_smooth_window = -1

# Overscan polynomial fitting parameters (for mean_polynomial method)
# Polynomial type: legendre, chebyshev, or polynomial
overscan_poly_type = legendre
# Polynomial order (degree)
overscan_poly_order = 3

# Detector amplifier split row (1-based row number dividing upper/lower readout halves).
# Used by overscan correction and by step 3 background fitting to process the two
# amplifier halves independently. Adjust this to match the MSTG193 slit
# spectrograph's CCD readout layout, or set to -1 for a single-amplifier
# detector (no split) / automatic (rows//2).
detector_split_row = -1

# Frame classification. This camera writes no OBSTYPE/IMAGETYP keyword, so the
# frame type is taken from the file name (case-insensitive substring match,
# checked in the order bias, flat, lamp, dark; anything else is science).
frame_type_source = filename
bias_keywords = bias
flat_keywords = flat
lamp_keywords = fear
dark_keywords = dark

# Optional crop bounds after overscan subtraction/trimming (DS9 indexing, 1-based, inclusive)
# Set any value < 1 to disable manual crop (default: disabled)
trim_x_start = -1
trim_x_end = -1
trim_y_start = -1
trim_y_end = -1

[reduce]
# Output directory path for all processing results
# Note: These are default values. Users should create specproc.cfg in their working directory
# to override these paths for their specific projects.
#
# Path behavior:
# - output_path = /data/output      → Absolute path, saves to /data/output/
# - output_path = ./output          → Relative path, saves to working_directory/output/
# - output_path = output            → Same as above, also relative to working directory
#   (e.g., if working in /myworkspace/, saves to /myworkspace/output/)
#
# Examples (assuming working directory is /myworkspace/):
#   output_path = ./output          → Results to /myworkspace/output/
#   output_path = output            → Same as above, results to /myworkspace/output/
#   output_path = /data/output      → Results to /data/output/
output_path = output

# Cosmic ray correction (part of STEP 1)
cosmic_enabled = yes

# Parameters for L.A.Cosmic algorithm (astropy.cosmics.lacosmic)
cosmic_sigclip = 5.0          # Detection threshold (sigma). Higher values are more conservative.
cosmic_objlim = 5.0           # Contrast limit between cosmic ray and underlying object.
cosmic_gain = 0.5             # Detector gain. Set to 0.0 to auto-detect from config.
cosmic_readnoise = 8.0        # Detector read noise. Set to 0.0 to auto-detect from config.

# Processing mode: normal or debug
mode = normal

# Output figure format: png, pdf, jpg
fig_format = pdf

# Output filename suffix
oned_suffix = _ods

# Auto process all science images without confirmation dialog
auto_process_all_images = yes

# Plotting options
# Whether to save diagnostic plots for each step
# Set to 'yes' or 'no'
# Default is 'yes'
save_plots = yes

# Output directory structure:
# output/
#   ├── step1_basic/            # Step 1: Basic pre-processing
#   │   ├── overscan_corrected/ # Overscan-corrected images and diagnostic plots
#   │   │   └── *_overscan_profile.pdf  # Overscan rows and applied correction model
#   │   ├── bias_subtracted/    # Master bias and bias-corrected images
#   │   └── cosmic_corrected/   # Cosmic ray corrected science images (if enabled)
#   ├── step2_flat/             # Step 2: Master flat field, blaze profiles, and diagnostic plots
#   ├── step2_trace/            # Trace text files and *_trace.pdf (centre, slit edges, aperture, sky regions)
#   ├── step3_background/       # Step 3: Background model and diagnostic plots
#   ├── step5_extraction/       # Step 5: Extracted spectra, sky diagnostics, slit_distortion.pdf
#   ├── step6_deblazing/        # Step 6: De-blazed spectra and diagnostic plots (if saved)
#   └── step7_wavelength/       # Step 7: Final wavelength calibrated 1D spectra and plots
#       └── master_flat_optimal_wavecal.fits     # Wavelength-calibrated 1D master-flat spectrum

[telescope]
# Telescope name for calibration lookup
# This is looked up in: calib_data/telescopes/<name>/
# mstg193slit: Muztagh-Ata Observatory 1.93m telescope slit spectrograph
# For user telescope: Create custom directory under calib_data/telescopes/
name = mstg193slit

# Spectrograph instrument name (used for calibration file lookup)
# Calibration files are located in: calib_data/telescopes/<telescope_name>/
# slit: long-slit spectrograph
# File naming: <instrument>_wlcalib_<YYYYMMDDHH>_<suffix>.fits
instrument = slit

[telescope.detector]
# Detector parameters
# Note: nrows and ncols are automatically detected from FITS files
# CCD gain
gain = 0.5

# Read noise
readnoise = 8.0

# ============================================================================
# DATA REDUCTION CONFIGURATION
# ============================================================================

# Bias correction (STEP 1)
[slit]
# Long-slit pipeline (selected by [telescope] instrument = slit).
# Dispersion runs along image rows (y): y or x
dispersion_axis = y

# Slit band columns (1-based, after overscan trimming). -1 = auto-detect from the
# flat. Test data: R camera ~1910-2390, B camera ~1790-2265 (band ~470 px wide,
# peak near the centre column, tilted by ~40 px over the full length).
band_start = -1
band_end = -1
band_threshold = 0.05

# Pixel-flat smoothing box (pixels): flat / smoothed flat removes pixel-to-pixel
# response only, keeping the large-scale (lamp/illumination) shape untouched.
flat_smooth_pixels = 21
# Pixel-flat is not applied within this many columns of each slit-band edge (edge smoothing bias)
flat_edge_margin = 40

# Slit trace on the master flat (half-maximum edges, centre = midpoint): polynomial
# order along dispersion and number of row bins. The star/lamp trace is this
# centre line plus a constant offset measured on each science frame.
trace_order = 2
trace_bins = 40
# Max deviation (px) of the fitted star/lamp trace from the slit-edge trend (after removing
# a constant and a linear drift); larger deviations rebuild the trace from the edge trend.
trace_edge_tolerance = 3.0

# Extraction half-width (pixels, star FWHM ~7) and sky region starting
# sky_inner_offset pixels from the trace; sky is fitted per row (order sky_order)
extract_half_width = 12
# aperture_mode = auto: measure the spatial FWHM of each science frame by stacking
# the profile along the whole dispersion axis (works for faint targets), take the
# median over frames, then use extraction half-width = aperture_fwhm_factor * FWHM
# and sky region starting at sky_fwhm_factor * FWHM from the trace. If the FWHM
# cannot be measured, extract_half_width / sky_inner_offset are used instead.
# aperture_mode = fixed always uses the two values given here.
aperture_mode = auto
aperture_fwhm_factor = 1.7
sky_fwhm_factor = 3.0
sky_inner_offset = 20
sky_order = 2
# Cross-slit sky order is chosen per row (BIC) between sky_order and sky_max_order, so rows with
# strong sky lines (curved cross-slit profile) are not over/under-subtracted by a straight line.
sky_max_order = 3
# The sky is fitted per row between the slit edges of the master-flat trace (the edges are tilted,
# not a fixed column range) and subtracted up to the edges. Columns within sky_edge_margin of an
# edge are left out of the fit only (illumination fall-off); the model is extended to the edge.
sky_edge_margin = 5

# Slit curvature: the arc lines are tilted/curved across the slit. Arc lines are measured in column
# bins across the slit (median of all lamp frames) and a polynomial shift field s(x, y) is fitted.
# Science frames remain on the native pixel grid; only the sky/background model is aligned to common
# wavelength rows using this field, avoiding interpolation of the flat-corrected science image.
# A diagnostic plot is written to step5_extraction/slit_distortion.pdf. Active whenever lamps are given.

# Valid pixel range: where the master-flat (else lamp) 1D spectrum exceeds snr_valid_fraction of its
# 95th-percentile flux. All 1D spectra (*.fits and *.pdf) are written for this range only, the
# valid wavelength range follows from it. SNR is measured at 30/50/70% of this range.
# A Savitzky-Golay continuum (window snr_smooth_window px) is iteratively fitted with 3-sigma
# clipping; SNR = local median continuum (+-snr_half_window px) / residual sigma (1.4826 x MAD).
# snr_noise_mode: local = 1.4826 x MAD of the clipped residuals inside the +-snr_half_window window
# (default; follows the noise level along the spectrum); global = 1.4826 x MAD of the whole valid range.
# Broad lines are handled by the iterative clipping (rejected regions are widened) and a warning is
# logged when the local RMS exceeds 1.5x a line-insensitive second-difference estimate.
snr_valid_fraction = 0.05
snr_smooth_window = 151

# Night-sky emission lines on step7_wavelength/*_sky_wavecal.pdf: every significant peak is
# matched (tolerance = FWHM/2 of the arc lines, sky_match_tolerance if unavailable).
# Median resolution R < sky_resolution_split: peaks are matched to the OH list
# (sky_lowres_linelist), named via sky_id_linelist within sky_id_tolerance, and non-OH lines
# ([OI], Na, Hg, ...) from sky_id_linelist are matched separately; peaks absent from the OH list
# are then matched against the whole sky_id_linelist.
# R >= sky_resolution_split: peaks are matched directly to sky_id_linelist.
sky_resolution_split = 4000
sky_lowres_linelist = calib_data/linelists/lowskylines.dat
sky_id_linelist = calib_data/linelists/skylines.dat
sky_id_tolerance = 1.5
sky_match_tolerance = 3.0
snr_noise_mode = local

# Wavelength calibration of the arc extracted along the star trace.
# Preferred: identification_file = text/CSV file with "pixel, wavelength(A)" rows
# (0-based pixel along the dispersion axis; see output/step7_wavelength/<lamp frame>_peaks.csv).
# Create it with the automatic tool `specproc identify --auto` (strong FeAr lines matched
# against calib_data/linelists/fear.fits) or with the interactive tool `specproc.identify`.
# A few anchors are enough: they give a rough solution that is extended to all lamp peaks
# by matching against full_linelist (see [telescope.linelist]).
# Alternative: approximate wavelength at the first/last pixel for automatic matching
# against full_linelist (leave 0 to disable). Without either, spectra stay on a pixel axis.
# For RR2000V the 4096-pixel frame covers approximately 3970-11680 A
# (~1.88 A/pix).  The cubic solution was checked on the 2026-10-10 science
# frame with the night-sky spectrum: [OI] 5577.3 A at pixel 976, the Na I
# 5890/5896 doublet at 1153, [OI] 6300.3 at 1380, [OI] 6363.8 at 1414 and
# geocoronal H-alpha 6562.8 at 1522 all land on observed sky peaks.  (The very
# strong sky peak at pixel 2450 is OH 8345 A, not [OI] 6300.)  The lamp-line
# FWHM is ~2.1 pix, i.e. R ~ 2000 near the 8000 A blaze.
# These values are only the seed for the automatic matcher; the anchor file
# written by `specproc identify` is the authoritative calibration.
identification_file = calib_data/telescopes/mstg193slit/mstg193slit_anchors_R.csv
wave_start = 3970
wave_end = 11680
# Final 1-D pixel -> wavelength fit.  legendre/chebyshev are numerically
# better conditioned than the ordinary polynomial at degree 5; polynomial
# is kept for backward compatibility.  Use 5 with enough well-spread lines.
wave_poly_type = legendre
wave_poly_order = 5
match_tolerance = 3.0
# Peak detection threshold in units of the global noise sigma (MAD of the continuum-subtracted
# spectrum, iteratively 3-sigma clipped), used for both lamp and night-sky spectra.
# Anchor matching uses the highest-S/N peaks (as many as there are anchors); full-catalogue
# matching uses all detected peaks. Without an identification_file the strong_peak_count
# highest-S/N peaks seed the automatic identification.
peak_snr = 10.0
strong_peak_count = 30

# 1-D spectrum SNR, evaluated at 30%/50%/70% of the valid pixel range (see the snr_* options
# in [slit] above) using windows of +-snr_half_window pixels. Computed before wavelength calibration (position in pixel,
# step5_extraction/*_optimal.pdf) and after it (position in Angstrom,
# step7_wavelength/*_optimal_wavecal.pdf).
snr_half_window = 50

[reduce.bias]
# Image combination method: mean, median, or sigma_clip
combine_method = median

# Sigma clipping threshold
combine_sigma = 3.0

# Flat fielding (STEP 2)
[reduce.flat]
# Flat combination method
combine_method = median

# Quality threshold for flat response
q_threshold = 0.5

# Maximum count for mosaic operation
mosaic_maxcount = 65535.0

# Smoothing factor for automated B-spline blaze fitting (blue/dark orders).
# s = factor * N_points * variance. Typical values: 0.5 - 2.0.
# Larger = more rigid curve, Smaller = softer fit tracking local noise.
blaze_smooth_factor = 1.0

# Window size for per-column width smoothing W_smooth(X)
width_smooth_window = 41

# Number of segments along X for cross-dispersion profile (>=1; more segments
# track PSF shape changes better). 100 recommended for 4k detectors.
n_profile_segments = 100

# Gaussian sigma (in segment units) for smoothing profiles along X.
# Ensures cross-dispersion profiles vary continuously. 0 = no smooth.
profile_smooth_sigma = 6.0

# Binning step on normalized coordinate y_norm for universal profile
profile_bin_step = 0.01

# Number of red-end apertures to apply Upper Envelope Chebyshev fitting.
# This combats strong interference fringes at the long-wavelength end.
# Recommended: 20-30 for typical echelle spectrographs. Set to 0 to disable.
fringe_orders = 20

# Pixel-flat cleaning range inside apertures (outside range -> set to 1.0)
pixel_flat_min = 0.5
pixel_flat_max = 1.5

# Background subtraction (STEP 3)
[reduce.background]
# Background estimation method: convolution, column_spline, or bspline
# 'convolution' uses astropy NaN-aware 2D Gaussian convolution (recommended for
# reproducing local structures like ripples/fringes); 'column_spline' fits a
# smoothing spline per column through inter-aperture pixels then lightly smooths
# horizontally; 'bspline' uses bivariate spline.
method = convolution

# 2D fit order (for bspline)
poly_order = 3

# Gaussian kernel sigma for convolution method (pixels)
# 建议: kernel_sigma_x = 13.0 (极细核，完美刻画横向条纹波动), kernel_sigma_y = 13.0 (刚好跨越 10-12px mask 并保留纵向高频结构)
kernel_sigma_x = 13.0
kernel_sigma_y = 13.0

# Column-wise 1D spline parameters (for column_spline method)
# spline_smooth_factor: multiplier on N_bg_pixels to set spline smoothing s.
# Smaller values → more flexible spline that follows ripple peaks/troughs.
spline_smooth_factor = 1.0
# spline_post_smooth_x: Gaussian σ (px) for light horizontal smoothing after
# assembling per-column backgrounds. Removes column-to-column discontinuities.
spline_post_smooth_x = 5.0

# Sigma clipping threshold for robust fit sampling
sigma_clip = 3.0

# Maximum sigma clipping iterations
sigma_clip_maxiters = 4

# Pixel margin outside traced aperture edges to mask PSF wings
mask_margin_pixels = 1

# B-spline smoothing factor scale (larger = smoother)
bspline_smooth = 1.0

# Sigma-clipping mode: both (symmetric), upper (reject bright outliers only,
# recommended for flats with unmasked faint apertures), or lower.
sigma_clip_mode = upper

# ============================================================================
# TRACE & EXTRACTION CONFIGURATION
# ============================================================================

# Aperture tracing
[reduce.trace]
# Aperture detection SNR threshold (multiples of sigma above background)
# Typical: 3.0-10.0. Lower values detect much fainter apertures but may pick up noise.
snr_threshold = 5.0

# Gap factor to trigger missing-aperture insertion
gap_fill_factor = 1.6

# Minimum trace coverage (fraction of detector width) to accept an aperture.
# Apertures spanning less than this fraction are rejected as likely false traces.
min_trace_coverage = 0.20

# Polynomial degree for aperture traces
degree = 3

# Polynomial degree for aperture upper/lower boundary widths
width_cheb_degree = 3

# Step 2: number of predicted apertures to extend below the first detected aperture
n_extend_below = 0

# Step 2: number of predicted apertures to extend above the last detected aperture
n_extend_above = 0

# Step 3 background mask: virtual apertures to add below the first aperture
n_mask_below = 4

# Step 3 background mask: virtual apertures to add above the last aperture
n_mask_above = 4

# Aperture boundary SNR threshold: the aperture edge is where the signal
# drops to N × σ above background. Lower = wider apertures. Typical 2.0-5.0.
aperture_boundary_snr = 3.0

# Spectrum extraction
[reduce.extract]

# ============================================================================
# WAVELENGTH CALIBRATION CONFIGURATION
# ============================================================================

# Calibration lamp and files
[telescope.linelist]
# Recommended lamp type: ThAr, Ar, Ne, He, Fe
# or use 'custom' to specify custom linelist file
linelist_type = FeAr

# Complete path to anchor file (identified reference lines)
# The slit pipeline uses [slit] identification_file; this entry is kept for
# echelle-style tools and points at the same FeAr anchor file.
anchor_file = calib_data/telescopes/mstg193slit/mstg193slit_anchors_R.csv

# Complete path to the full lamp catalog linelist
# fear.dat is the Willmarth FeAr list shipped with SpecProc.
full_linelist = calib_data/linelists/fear.dat

# Use pre-identified calibration files (optional)
# If enabled, load existing wavelength calibration instead of fitting
use_precomputed_calibration = no

# Complete path to precomputed calibration FITS file
# Place pre-identified wavelength calibration FITS files for this telescope
# under calib_data/telescopes/mstg193slit/ and update this path accordingly.
precomputed_calib_file = calib_data/telescopes/mstg193slit/wlcalib_mstg193slit.fits


[reduce.wlcalib]
# Polynomial order for wavelength solution
# xorder: order in dispersion direction
# yorder: order in spatial direction (across orders)
xorder = 3
yorder = 3

# Polynomial type for 2D fitting: chebyshev, legendre, or polynomial
# Orthogonal polynomials (chebyshev/legendre) are highly recommended for stability.
poly_type = chebyshev

# Maximum allowed residual (Angstrom) for valid lines in the final fit
rms_threshold = 0.5

# Tolerance (Angstrom) for matching predicted wavelengths to the full catalog
match_tolerance = 2.0

# Advanced parameters

# Number of apertures to discard at the highest and lowest aperture IDs 
# during anchor matching to avoid noisy/incomplete edge orders
discard_highest_apertures = 5 
discard_lowest_apertures = 20

# ============================================================================
# PROCESSING & OUTPUT CONFIGURATION
# ============================================================================

[reduce.save_intermediate]
# Whether to save intermediate results for each step
# Set to 'yes' or 'no' for each step independently
# Default is 'yes' for all steps
save_overscan = yes        # Step 1: Overscan correction (saves to output/step1_basic/overscan_corrected/)
save_bias = yes             # Step 1: Bias correction (saves to output/step1_basic/bias_subtracted/)
save_flat = yes              # Step 2: Flat fielding (saves master flat to output/step2_flat/)
save_background = yes        # Step 3: Background subtraction (saves model to output/step3_background/)
save_cosmic = yes           # Step 1: Cosmic ray correction (saves to output/step1_basic/cosmic_corrected/)
save_extraction = yes       # Step 5: Spectrum extraction (saves to output/step5_extraction/)
save_deblaze = yes          # Step 6: De-blazing (saves to output/step6_deblazing/)
save_wlcalib = yes          # Step 7: Wavelength calibration (saves solution to output/step7_wavelength/)
